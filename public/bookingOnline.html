<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPS Hotel Booking</title>
  <style>
    body {
      font-family: "Georgia", serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
      color: #333;
    }

    header {
      background-color: #00264d;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 4px solid #004080;
    }

    header img {
      width: 80px;
      height: 80px;
      display: block;
      margin: 0 auto 10px;
    }

    header h1 {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 16px;
      margin-top: 10px;
      font-style: italic;
    }

    .nav-box {
      background-color: #004080;
      padding: 15px 0;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.1);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav li a {
      font-family: 'Times New Roman', Times, serif;
      color: #fff;
      text-decoration: none;
      padding: 10px 25px;
      border: 1px solid #ffffff44;
      border-radius: 4px;
      transition: background-color 0.3s ease;
      font-size: 16px;
      background-color: #0059b3;
    }

    nav li a:hover {
      background-color: #0073e6;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h2 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 28px;
      margin-bottom: 25px;
      color: #00264d;
      text-align: center;
    }

    form {
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 18px;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Times New Roman', Times, serif;
    }

    button {
      background-color: #0059b3;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-family: 'Times New Roman', Times, serif;
      margin-top: 10px;
    }

    button:hover {
      background-color: #003366;
    }

    footer {
      font-family: 'Times New Roman', Times, serif;
      background-color: #00264d;
      color: #e0e0e0;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo/logo1.png" alt="SPS Hotel Logo">
    <h1>SPS Hotel Portal</h1>
    <p>Your Comfort is Our Priority</p>
  </header>

  <div class="nav-box">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="room.html">Rooms</a></li>
        <li><a href="bookingOnline.html">Booking</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="payment.html">Payment</a></li>
        <li><a href="service%20customer.html">Service</a></li>
      </ul>
    </nav>
  </div>

  <main>
    <h2>Online Booking Form</h2>
    <form>
      <div>
        <label for="bookingId">Booking ID</label>
        <input type="text" id="bookingId" name="bookingId" required />
      </div>
      <div>
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" name="customerName" required />
      </div>
      <div>
        <label for="roomType">Room Type</label>
        <select id="roomType" name="roomType">
          <option value="single">Single</option>
          <option value="double">Double</option>
          <option value="suite">Suite</option>
        </select>
      </div>
      <div>
        <label for="checkIn">Check-In Date</label>
        <input type="date" id="checkIn" name="checkIn" required />
      </div>
      <div>
        <label for="checkOut">Check-Out Date</label>
        <input type="date" id="checkOut" name="checkOut" required />
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <button type="submit">Submit Booking</button>
    </form>
  </main>

  <footer>
    &copy; 2025 SPS Hotel. All rights reserved.
  </footer>

</body>
</html>
