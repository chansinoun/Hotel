<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPS Hotel Service Request</title>
  <style>
    body {
      font-family: "Georgia", serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
      color: #333;
    }

    header {
      background-color: #00264d;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 4px solid #004080;
    }

    header img {
      width: 80px;
      height: 80px;
      display: block;
      margin: 0 auto 10px;
    }

    header h1 {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-box {
      background-color: #004080;
      padding: 15px 0;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.1);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav li a {
      font-family: 'Times New Roman', Times, serif;
      color: #fff;
      text-decoration: none;
      padding: 10px 25px;
      border: 1px solid #ffffff44;
      border-radius: 4px;
      transition: background-color 0.3s ease;
      font-size: 16px;
      background-color: #0059b3;
    }

    nav li a:hover {
      background-color: #0073e6;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h2 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 28px;
      margin-bottom: 25px;
      color: #00264d;
      text-align: center;
    }

    form {
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 18px;
      display: block;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Times New Roman', Times, serif;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      background-color: #0059b3;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-family: 'Times New Roman', Times, serif;
      margin-top: 10px;
    }

    button:hover {
      background-color: #003366;
    }

    footer {
      font-family: 'Times New Roman', Times, serif;
      background-color: #00264d;
      color: #e0e0e0;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo/logo1.png" alt="SPS Hotel Logo">
    <h1>SPS Hotel Service Request</h1>
  </header>

  <div class="nav-box">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="room.html">Rooms</a></li>
        <li><a href="bookingOnline.html">Booking</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="payment.html">Payment</a></li>
        <li><a href="service%20customer.html">Service</a></li>
      </ul>
    </nav>
  </div>

  <main>
    <h2>Guest Service Request Form</h2>
    <form>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required />

      <label for="roomNumber">Room Number</label>
      <input type="text" id="roomNumber" name="roomNumber" required />

      <label for="foodOption">Select Food Option</label>
      <select id="foodOption" name="foodOption">
        <option value="">Select</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Lunch">Lunch</option>
        <option value="Dinner">Dinner</option>
        <option value="Room Service">Room Service</option>
      </select>

      <label for="guestService">Guest Relations Service</label>
      <select id="guestService" name="guestService">
        <option value="">Select</option>
        <option value="Concierge">Concierge</option>
        <option value="Tour Guide">Tour Guide</option>
        <option value="Laundry">Laundry</option>
      </select>

      <label for="securityService">Security Service</label>
      <select id="securityService" name="securityService">
        <option value="">Select</option>
        <option value="Safe Box">Safe Box</option>
        <option value="Room Lock">Room Lock</option>
        <option value="Escort">Escort</option>
      </select>

      <label for="generalService">General Service</label>
      <select id="generalService" name="generalService">
        <option value="">Select</option>
        <option value="Cleaning">Cleaning</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Wake-up Call">Wake-up Call</option>
      </select>

      <label for="comments">Comments or Requests</label>
      <textarea id="comments" name="comments" placeholder="Enter any special requests or notes..."></textarea>

      <button type="submit">Submit Request</button>
    </form>
  </main>

  <footer>
    &copy; 2025 SPS Hotel. All rights reserved.
  </footer>

</body>
</html>
