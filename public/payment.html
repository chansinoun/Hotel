<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPS Hotel Receipt</title>
  <style>
    body {
      font-family: "Georgia", serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
      color: #333;
    }

    header {
      background-color: #00264d;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 4px solid #004080;
    }

    header img {
      width: 80px;
      height: 80px;
      display: block;
      margin: 0 auto 10px;
    }

    header h1 {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-box {
      background-color: #004080;
      padding: 15px 0;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.1);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav li a {
      font-family: 'Times New Roman', Times, serif;
      color: #fff;
      text-decoration: none;
      padding: 10px 25px;
      border: 1px solid #ffffff44;
      border-radius: 4px;
      transition: background-color 0.3s ease;
      font-size: 16px;
      background-color: #0059b3;
    }

    nav li a:hover {
      background-color: #0073e6;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    h2 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 28px;
      margin-bottom: 25px;
      color: #00264d;
      text-align: center;
    }

    form {
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 18px;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Times New Roman', Times, serif;
    }

    button {
      background-color: #0059b3;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-family: 'Times New Roman', Times, serif;
      margin-top: 10px;
    }

    button:hover {
      background-color: #003366;
    }

    footer {
      font-family: 'Times New Roman', Times, serif;
      background-color: #00264d;
      color: #e0e0e0;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo/logo1.png" alt="SPS Hotel Logo">
    <h1>SPS Hotel Receipt</h1>
  </header>

  <div class="nav-box">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="room.html">Rooms</a></li>
        <li><a href="bookingOnline.html">Booking</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="payment.html">Payment</a></li>
        <li><a href="service%20customer.html">Service</a></li>
      </ul>
    </nav>
  </div>

  <main>
    <h2>Receipt Payment Form</h2>
    <form>
      <label for="receiptNo">Receipt No</label>
      <input type="text" id="receiptNo" name="receiptNo" required />

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="checkIn">Check-In Date</label>
      <input type="date" id="checkIn" name="checkIn" required />

      <label for="checkOut">Check-Out Date</label>
      <input type="date" id="checkOut" name="checkOut" required />

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="roomType">Room Type</label>
      <select id="roomType" name="roomType">
        <option value="">Select</option>
        <option value="Single">Single</option>
        <option value="Double">Double</option>
        <option value="Suite">Suite</option>
         <option>Executive Room</option>
          <option>Presidential Suite</option>
          <option>Family Room</option>
          <option>Accessible Room</option>
          <option>Triple Room</option>
          <option>Penthouse</option>
          <option>Sweet Room</option>
      </select>

      <label for="paymentMethod">Payment Method</label>
      <select id="paymentMethod" name="paymentMethod">
        <option value="">Select</option>
        <option value="Cash">Cash</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Online">Online</option>
      </select>

      <label for="discount">Discount (%)</label>
      <input type="number" id="discount" name="discount" min="0" max="100" />

      <label for="vip">VIP</label>
      <select id="vip" name="vip">
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label for="total">Total Amount</label>
      <input type="number" id="total" name="total" required />

      <button type="submit">Add Receipt</button>
    </form>
  </main>

  <footer>
    &copy; 2025 SPS Hotel. All rights reserved.
  </footer>

</body>
</html>
